<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <script>(function () { var t = localStorage.getItem("tema"); if (t) { document.documentElement.setAttribute("data-theme", t); } })();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Técnico | ITDESK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-protegido="Tecnico" data-footer="Panel del Técnico">
    <div class="app-shell">
        <div id="sidebar-placeholder"></div>
        <div class="app-main">
            <div id="topbar-mobile-placeholder"></div>
            <main class="app-content">

                <div class="page-head">
                    <h2>Bienvenido, <strong id="saludoUsuario"></strong></h2>
                    <p>La cola de trabajo del equipo, ordenada por lo que necesita atención primero.</p>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="card card-stat shadow-sm">
                            <div class="card-body">
                                <div class="card-stat-head">
                                    <span class="card-stat-icon tone-accent"><i class="bi bi-list-check"></i></span>
                                    <span class="card-stat-label">Tickets en Cola</span>
                                </div>
                                <div class="card-stat-value" id="statsAsignados">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card card-stat shadow-sm card-accent card-accent-warning">
                            <div class="card-body">
                                <div class="card-stat-head">
                                    <span class="card-stat-icon tone-warning"><i class="bi bi-hourglass-split"></i></span>
                                    <span class="card-stat-label">En Proceso</span>
                                </div>
                                <div class="card-stat-value" id="statsEnProceso">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card card-stat shadow-sm">
                            <div class="card-body">
                                <div class="card-stat-head">
                                    <span class="card-stat-icon tone-success"><i class="bi bi-check-circle"></i></span>
                                    <span class="card-stat-label">Finalizados</span>
                                </div>
                                <div class="card-stat-value" id="statsFinalizados">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mb-5">
                    <div class="card shadow">
                        <div class="card-header bg-itdesk text-white d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <h4 class="mb-0">Cola de trabajo</h4>
                            <div class="input-group input-group-sm" style="max-width: 320px;">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <label class="visually-hidden" for="buscarTicketTecnico">Buscar tickets</label>
                                <input type="text" id="buscarTicketTecnico" class="form-control"
                                    placeholder="Buscar por código, cliente, equipo...">
                            </div>
                            <span class="visually-hidden" aria-live="polite" id="resultadosBusquedaTicketTecnico"></span>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle table-mobile-cards">
                                    <thead>
                                        <tr>
                                            <th data-sort="id_ticket">ID</th>
                                            <th data-sort="cliente">Cliente</th>
                                            <th data-sort="equipo_tipo">Equipo</th>
                                            <th data-sort="titulo">Problema</th>
                                            <th data-sort="prioridad">Prioridad</th>
                                            <th data-sort="categoria">Categoría</th>
                                            <th data-sort="estado">Estado</th>
                                            <th data-sort="especialista">Especialista</th>
                                            <th>Próxima acción</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaTecnico">
                                        <tr>
                                            <td colspan="9" class="text-center text-muted">Cargando tickets...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div id="verMasTecnico" class="d-none mt-3 text-center"></div>
                        </div>
                    </div>
                </div>

            </main>
            <div id="footer-placeholder"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/codigos.js"></script>
    <script src="js/search.js"></script>
    <script src="js/ordenar.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/tecnico.js"></script>
</body>

</html>
