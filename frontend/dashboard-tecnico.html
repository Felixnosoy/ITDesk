<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <script>(function () { var t = localStorage.getItem("tema"); if (t) { document.documentElement.setAttribute("data-theme", t); return; } try { var u = JSON.parse(sessionStorage.getItem("usuario") || "null"); if (u && u.rol === "Tecnico") { document.documentElement.setAttribute("data-theme", "dark"); } } catch (e) {} })();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Técnico | ITDESK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css?v=2">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body data-protegido="Tecnico" data-footer="Panel del Técnico">
    <div class="app-shell">
        <div id="sidebar-placeholder"></div>
        <div class="app-main">
            <div id="topbar-mobile-placeholder"></div>
            <main class="app-content">

                <div class="page-head">
                    <div class="page-head-text">
                        <h2>Cola de trabajo</h2>
                        <p>Ordenada por lo que necesita atención primero.</p>
                    </div>
                </div>

                <div class="mini-stat-strip mb-4">
                    <div class="mini-stat">
                        <span class="mini-stat-label"><i class="bi bi-list-check"></i> Tickets en cola</span>
                        <span class="mini-stat-value" id="statsAsignados">0</span>
                    </div>
                    <div class="mini-stat">
                        <span class="mini-stat-label"><i class="bi bi-hourglass-split"></i> En proceso</span>
                        <span class="mini-stat-value" id="statsEnProceso">0</span>
                    </div>
                    <div class="mini-stat">
                        <span class="mini-stat-label"><i class="bi bi-check-circle"></i> Finalizados</span>
                        <span class="mini-stat-value" id="statsFinalizados">0</span>
                    </div>
                    <div class="mini-stat">
                        <span class="mini-stat-label"><i class="bi bi-stopwatch"></i> Mi tiempo promedio</span>
                        <span class="mini-stat-value" id="statsTiempoProm">—</span>
                    </div>
                    <div class="mini-stat">
                        <span class="mini-stat-label"><i class="bi bi-graph-up-arrow"></i> Mi eficiencia</span>
                        <span class="mini-stat-value" id="statsEficiencia">—</span>
                    </div>
                </div>

                <div class="mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <div class="btn-group btn-group-sm" role="group" aria-label="Cambiar vista de la cola">
                        <button type="button" class="btn btn-outline-secondary" id="btnVistaLista">
                            <i class="bi bi-list-ul"></i> Lista
                        </button>
                        <button type="button" class="btn btn-outline-secondary" id="btnVistaKanban">
                            <i class="bi bi-kanban"></i> Kanban
                        </button>
                    </div>
                    <div class="input-group input-group-sm" style="max-width: 320px;">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <label class="visually-hidden" for="buscarTicketTecnico">Buscar tickets</label>
                        <input type="text" id="buscarTicketTecnico" class="form-control"
                            placeholder="Buscar por código, cliente, equipo...">
                    </div>
                    <span class="visually-hidden" aria-live="polite" id="resultadosBusquedaTicketTecnico"></span>
                </div>

                <!-- VISTA LISTA (default): lista densa a la izquierda + panel
                     de detalle embebido a la derecha (detalle-ticket.html en
                     un iframe con ?embed=1, sin reescribir su logica). Bajo
                     1024px el panel no existe: un click navega directo. -->
                <div class="master-detail mb-5" id="vistaListaTecnico">
                    <div class="master-detail-lista" id="listaTicketsTecnico">
                        <div class="text-center text-muted py-4">Cargando tickets...</div>
                    </div>
                    <div class="master-detail-panel" id="panelDetalleTecnico">
                        <div class="empty-state">
                            <i class="bi bi-hand-index-thumb"></i>
                            <p class="mb-0">Elegí un ticket de la lista para ver el detalle.</p>
                        </div>
                    </div>
                </div>

                <!-- VISTA KANBAN (secundaria) -->
                <div class="kanban-grid mb-5 d-none" id="tableroTecnico">
                    <div class="text-center text-muted py-4">Cargando tickets...</div>
                </div>

            </main>
            <div id="footer-placeholder"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/codigos.js"></script>
    <script src="js/search.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/tecnico.js"></script>
</body>

</html>
