<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <script>(function () { var t = localStorage.getItem("tema"); if (t) { document.documentElement.setAttribute("data-theme", t); return; } try { var u = JSON.parse(sessionStorage.getItem("usuario") || "null"); if (u && u.rol === "Tecnico") { document.documentElement.setAttribute("data-theme", "dark"); } } catch (e) {} })();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial | ITDESK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css?v=2">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body data-protegido="Cliente" data-titulo="Historial" data-footer="Historial de Tickets">
    <div class="app-shell">
        <div id="sidebar-placeholder"></div>
        <div class="app-main">
            <div id="topbar-mobile-placeholder"></div>
            <div id="topbar-desktop-placeholder"></div>
            <main class="app-content">

                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb breadcrumb-itdesk">
                        <li class="breadcrumb-item"><a href="dashboard-cliente.html">Inicio</a></li>
                        <li class="breadcrumb-item active">Historial</li>
                    </ol>
                </nav>

                <div class="page-head">
                    <div class="page-head-text">
                        <h2>Historial de Tickets</h2>
                        <p class="text-muted">Resueltos o cerrados — entra a cada uno para el detalle.</p>
                    </div>
                </div>

                <div class="d-flex justify-content-end mb-3">
                    <div class="selector-orden">
                        <label class="visually-hidden" for="ordenHistorialSelect">Ordenar por</label>
                        <select class="form-select form-select-sm" id="ordenHistorialSelect">
                            <option value=":asc">Más reciente</option>
                            <option value="estado:asc">Estado</option>
                            <option value="titulo:asc">Título</option>
                        </select>
                    </div>
                </div>

                <!-- Regla de densidad por rol: el cliente nunca ve una tabla
                     (Bloque 4) — .table-cards-siempre reusa el mismo diseño
                     de tarjeta que table-mobile-cards ya usaba solo en
                     movil, pero activo en todos los anchos. -->
                <table class="table table-hover align-middle table-mobile-cards table-cards-siempre">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Equipo</th>
                            <th>Título</th>
                            <th>Estado</th>
                            <th>Apertura</th>
                            <th>Cierre</th>
                            <th>Detalle</th>
                        </tr>
                    </thead>
                    <tbody id="tablaHistorial">
                        <tr>
                            <td colspan="7" class="text-center text-muted">Cargando historial...</td>
                        </tr>
                    </tbody>
                </table>
                <div id="verMasHistorial" class="d-none mt-3 text-center"></div>

            </main>
            <div id="footer-placeholder"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/codigos.js"></script>
    <script src="js/ordenar.js"></script>
    <script src="js/search.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/historial.js"></script>
</body>

</html>
