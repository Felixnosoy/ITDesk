<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <script>(function () { var t = localStorage.getItem("tema"); if (t) { document.documentElement.setAttribute("data-theme", t); } })();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial | ITDESK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-protegido="Cliente" data-footer="Historial de Tickets">
    <div class="app-shell">
        <div id="sidebar-placeholder"></div>
        <div class="app-main">
            <div id="topbar-mobile-placeholder"></div>
            <main class="app-content">

                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb breadcrumb-itdesk">
                        <li class="breadcrumb-item"><a href="dashboard-cliente.html">Inicio</a></li>
                        <li class="breadcrumb-item active">Historial</li>
                    </ol>
                </nav>

                <div class="page-head">
                    <h2 class="mb-1">Historial de Tickets</h2>
                    <p class="text-muted mb-0">Tickets resueltos o cerrados. Para el detalle completo, entra a cada ticket.</p>
                </div>

                <div class="card shadow">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle table-mobile-cards">
                                <thead>
                                    <tr>
                                        <th data-sort="id_ticket">ID</th>
                                        <th data-sort="equipo_tipo">Equipo</th>
                                        <th data-sort="titulo">Título</th>
                                        <th data-sort="estado">Estado</th>
                                        <th data-sort="fecha_apertura">Apertura</th>
                                        <th data-sort="fecha_cierre">Cierre</th>
                                        <th>Detalle</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaHistorial">
                                    <tr>
                                        <td colspan="7" class="text-center text-muted">Cargando historial...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div id="verMasHistorial" class="d-none mt-3 text-center"></div>
                    </div>
                </div>

            </main>
            <div id="footer-placeholder"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/codigos.js"></script>
    <script src="js/ordenar.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/historial.js"></script>
</body>

</html>
