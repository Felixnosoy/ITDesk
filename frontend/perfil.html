<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <script>(function () { var t = localStorage.getItem("tema"); if (t) { document.documentElement.setAttribute("data-theme", t); return; } try { var u = JSON.parse(sessionStorage.getItem("usuario") || "null"); if (u && u.rol === "Tecnico") { document.documentElement.setAttribute("data-theme", "dark"); } } catch (e) {} })();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | ITDESK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css?v=2">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body data-protegido="Administrador,Tecnico,Cliente,Recepcionista" data-footer="Mi Perfil">
    <div class="app-shell">
        <div id="sidebar-placeholder"></div>
        <div class="app-main">
            <div id="topbar-mobile-placeholder"></div>
            <div id="topbar-desktop-placeholder"></div>
            <main class="app-content">
                <div style="max-width: 640px;">

                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb breadcrumb-itdesk">
                            <li class="breadcrumb-item"><a href="#" id="breadcrumbInicio">Inicio</a></li>
                            <li class="breadcrumb-item active">Perfil</li>
                        </ol>
                    </nav>

                    <h2 class="page-head mb-4">Mi Perfil</h2>

                    <div class="card shadow">
                        <div class="card-body text-center">
                            <span class="perfil-avatar" id="perfilAvatar"></span>
                            <h4 class="mt-3 mb-0" id="perfilNombre"></h4>
                            <span id="perfilRol"></span>
                        </div>
                        <div class="card-body border-top">
                            <dl class="row mb-0" id="perfilDatos"></dl>
                        </div>
                        <div class="card-body border-top d-none" id="perfilAviso">
                            <p class="text-muted small mb-0">
                                <i class="bi bi-info-circle"></i>
                                No se pudieron cargar todos tus datos. Mostrando la información disponible.
                            </p>
                        </div>
                    </div>

                    <div class="card shadow mt-4">
                        <div class="card-header">
                            <i class="bi bi-person-lines-fill"></i> Editar mis datos
                        </div>
                        <div class="card-body">
                            <form id="formEditarPerfil" onsubmit="guardarPerfilPropio(event)">
                                <div class="mb-3">
                                    <label class="form-label" for="editarTelefono">Teléfono</label>
                                    <input type="text" id="editarTelefono" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="editarDireccion">Dirección</label>
                                    <input type="text" id="editarDireccion" class="form-control">
                                </div>
                                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                            </form>
                        </div>
                    </div>

                    <div class="card shadow mt-4">
                        <div class="card-header">
                            <i class="bi bi-shield-lock"></i> Cambiar contraseña
                        </div>
                        <div class="card-body">
                            <form id="formCambiarClave" onsubmit="cambiarClavePropia(event)">
                                <div class="mb-3">
                                    <label class="form-label" for="claveActual">Contraseña actual <span class="campo-requerido">*</span></label>
                                    <input type="password" id="claveActual" class="form-control" required autocomplete="current-password">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="claveNueva">Contraseña nueva <span class="campo-requerido">*</span></label>
                                    <input type="password" id="claveNueva" class="form-control" required minlength="8" autocomplete="new-password">
                                    <div class="form-text">Mínimo 8 caracteres.</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="claveNuevaConfirmar">Confirmar contraseña nueva <span class="campo-requerido">*</span></label>
                                    <input type="password" id="claveNuevaConfirmar" class="form-control" required minlength="8" autocomplete="new-password">
                                </div>
                                <button type="submit" class="btn btn-primary">Cambiar contraseña</button>
                            </form>
                        </div>
                    </div>

                </div>
            </main>
            <div id="footer-placeholder"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/codigos.js"></script>
    <script src="js/search.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/perfil.js"></script>
</body>

</html>
