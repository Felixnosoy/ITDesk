<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <script>(function () { var t = localStorage.getItem("tema"); if (t) { document.documentElement.setAttribute("data-theme", t); return; } try { var u = JSON.parse(sessionStorage.getItem("usuario") || "null"); if (u && u.rol === "Tecnico") { document.documentElement.setAttribute("data-theme", "dark"); } } catch (e) {} })();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría | ITDESK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css?v=2">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body data-protegido="Administrador,Tecnico" data-titulo="Auditoría" data-footer="Auditoría">
    <div class="app-shell">
        <div id="sidebar-placeholder"></div>
        <div class="app-main">
            <div id="topbar-mobile-placeholder"></div>
            <div id="topbar-desktop-placeholder"></div>
            <main class="app-content">

                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb breadcrumb-itdesk">
                        <li class="breadcrumb-item"><a href="#" id="breadcrumbInicio">Inicio</a></li>
                        <li class="breadcrumb-item active">Auditoría</li>
                    </ol>
                </nav>

                <div class="page-head">
                    <div class="page-head-text">
                        <h2>Auditoría</h2>
                        <p class="text-muted">Quién hizo qué y cuándo — registro permanente.</p>
                    </div>
                </div>

                <div class="row g-2 align-items-end mb-3">
                    <div class="col-12 col-md-3">
                        <label class="form-label small mb-1" for="buscarAuditoria">Buscar</label>
                        <div class="input-group input-group-sm">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" id="buscarAuditoria" class="form-control"
                                placeholder="Usuario, acción, ticket...">
                        </div>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label small mb-1" for="filtroUsuarioAuditoria">Usuario</label>
                        <select class="form-select form-select-sm" id="filtroUsuarioAuditoria">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label small mb-1" for="filtroAccionAuditoria">Acción</label>
                        <select class="form-select form-select-sm" id="filtroAccionAuditoria">
                            <option value="">Todas</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label small mb-1" for="filtroDesdeAuditoria">Desde</label>
                        <input type="date" class="form-control form-control-sm" id="filtroDesdeAuditoria">
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label small mb-1" for="filtroHastaAuditoria">Hasta</label>
                        <input type="date" class="form-control form-control-sm" id="filtroHastaAuditoria">
                    </div>
                    <div class="col-6 col-md-1">
                        <button type="button" class="btn btn-outline-secondary btn-sm w-100" id="btnLimpiarFiltrosAuditoria" title="Limpiar filtros">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </div>
                <span class="visually-hidden" aria-live="polite" id="resultadosBusquedaAuditoria"></span>

                <div>
                    <div class="card shadow">
                        <div class="card-header">
                            Últimos eventos
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle table-mobile-cards">
                                    <thead>
                                        <tr>
                                            <th data-sort="fecha">Fecha</th>
                                            <th data-sort="usuario">Usuario</th>
                                            <th>Descripción</th>
                                            <th data-sort="id_ticket">Ticket</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaAuditoria">
                                        <tr>
                                            <td colspan="4" class="text-center text-muted">Cargando...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div id="verMasAuditoria" class="d-none mt-3 text-center"></div>
                        </div>
                    </div>
                </div>

            </main>
            <div id="footer-placeholder"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/codigos.js"></script>
    <script src="js/search.js"></script>
    <script src="js/ordenar.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/auditoria.js"></script>
</body>

</html>
