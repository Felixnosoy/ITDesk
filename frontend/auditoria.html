<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <script>(function () { var t = localStorage.getItem("tema"); if (t) { document.documentElement.setAttribute("data-theme", t); } })();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría | ITDESK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-protegido="Administrador,Tecnico" data-footer="Auditoría">
    <div class="app-shell">
        <div id="sidebar-placeholder"></div>
        <div class="app-main">
            <div id="topbar-mobile-placeholder"></div>
            <main class="app-content">

                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb breadcrumb-itdesk">
                        <li class="breadcrumb-item"><a href="#" id="breadcrumbInicio">Inicio</a></li>
                        <li class="breadcrumb-item active">Auditoría</li>
                    </ol>
                </nav>

                <div class="page-head">
                    <h2 class="mb-1">Auditoría</h2>
                    <p class="text-muted mb-0">Registro de acciones clave del sistema: quién hizo qué y cuándo. Se guarda de forma permanente, no depende de esta pantalla ni del navegador.</p>
                </div>

                <div class="mb-3">
                    <div class="input-group" style="max-width: 420px;">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <label class="visually-hidden" for="buscarAuditoria">Buscar en auditoría</label>
                        <input type="text" id="buscarAuditoria" class="form-control"
                            placeholder="Buscar por usuario, acción, ticket...">
                    </div>
                    <span class="visually-hidden" aria-live="polite" id="resultadosBusquedaAuditoria"></span>
                </div>

                <div>
                    <div class="card shadow">
                        <div class="card-header bg-itdesk text-white">
                            Últimos eventos
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle table-mobile-cards">
                                    <thead>
                                        <tr>
                                            <th data-sort="fecha">Fecha</th>
                                            <th data-sort="usuario">Usuario</th>
                                            <th>Descripción</th>
                                            <th data-sort="id_ticket">Ticket</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaAuditoria">
                                        <tr>
                                            <td colspan="4" class="text-center text-muted">Cargando...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div id="verMasAuditoria" class="d-none mt-3 text-center"></div>
                        </div>
                    </div>
                </div>

            </main>
            <div id="footer-placeholder"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/codigos.js"></script>
    <script src="js/search.js"></script>
    <script src="js/ordenar.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/auditoria.js"></script>
</body>

</html>
