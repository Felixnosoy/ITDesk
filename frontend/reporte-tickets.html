<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <script>(function () { var t = localStorage.getItem("tema"); if (t) { document.documentElement.setAttribute("data-theme", t); return; } try { var u = JSON.parse(sessionStorage.getItem("usuario") || "null"); if (u && u.rol === "Tecnico") { document.documentElement.setAttribute("data-theme", "dark"); } } catch (e) {} })();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets Registrados | ITDESK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css?v=2">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body data-protegido="Administrador" data-footer="Reporte de Tickets Registrados">
    <div class="app-shell">
        <div id="sidebar-placeholder"></div>
        <div class="app-main">
            <div id="topbar-mobile-placeholder"></div>
            <div id="topbar-desktop-placeholder"></div>
            <main class="app-content">

                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb breadcrumb-itdesk">
                        <li class="breadcrumb-item"><a href="dashboard-admin.html">Inicio</a></li>
                        <li class="breadcrumb-item"><a href="reportes.html">Reportes</a></li>
                        <li class="breadcrumb-item active">Tickets registrados</li>
                    </ol>
                </nav>

                <div class="page-head">
                    <div class="page-head-text">
                        <h2>Reporte de Tickets Registrados</h2>
                        <p class="text-muted" id="ticketsActualizado">Cargando datos en vivo...</p>
                    </div>
                </div>
                <div class="alert alert-danger d-none mt-2 py-2 px-3" id="ticketsError"></div>

                <div class="card shadow">
                    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <h4 class="mb-0">Reporte de Tickets Registrados</h4>
                        <button type="button" class="btn btn-primary btn-sm" id="btnImprimirReporteTickets">
                            <i class="bi bi-printer"></i> Imprimir / Guardar PDF
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="row g-2 align-items-end mb-3">
                            <div class="col-6 col-md-2">
                                <label class="form-label small mb-1" for="filtroEstadoReporte">Estado</label>
                                <select class="form-select form-select-sm" id="filtroEstadoReporte">
                                    <option value="">Todos</option>
                                    <option value="Abierto">Abierto</option>
                                    <option value="En proceso">En proceso</option>
                                    <option value="Resuelto">Resuelto</option>
                                    <option value="Cerrado">Cerrado</option>
                                </select>
                            </div>
                            <div class="col-6 col-md-2">
                                <label class="form-label small mb-1" for="filtroPrioridadReporte">Prioridad</label>
                                <select class="form-select form-select-sm" id="filtroPrioridadReporte">
                                    <option value="">Todas</option>
                                    <option value="Alta">Alta</option>
                                    <option value="Media">Media</option>
                                    <option value="Baja">Baja</option>
                                </select>
                            </div>
                            <div class="col-6 col-md-3">
                                <label class="form-label small mb-1" for="filtroTecnicoReporte">Técnico</label>
                                <select class="form-select form-select-sm" id="filtroTecnicoReporte">
                                    <option value="">Todos</option>
                                </select>
                            </div>
                            <div class="col-6 col-md-2">
                                <label class="form-label small mb-1" for="filtroDesdeReporte">Desde</label>
                                <input type="date" class="form-control form-control-sm" id="filtroDesdeReporte">
                            </div>
                            <div class="col-6 col-md-2">
                                <label class="form-label small mb-1" for="filtroHastaReporte">Hasta</label>
                                <input type="date" class="form-control form-control-sm" id="filtroHastaReporte">
                            </div>
                            <div class="col-6 col-md-1">
                                <button type="button" class="btn btn-outline-secondary btn-sm w-100" id="btnLimpiarFiltrosReporte" title="Limpiar filtros">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle table-mobile-cards">
                                <thead>
                                    <tr>
                                        <th>No.</th>
                                        <th>Ticket</th>
                                        <th>Cliente</th>
                                        <th>Equipo</th>
                                        <th>Serial</th>
                                        <th>Prioridad</th>
                                        <th>Estado</th>
                                        <th>Técnico</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaReporteTickets">
                                    <tr><td colspan="8" class="text-center text-muted">Cargando tickets...</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-end mt-2">
                            <label class="visually-hidden" for="cantidadReporteTickets">Cantidad a mostrar</label>
                            <select class="form-select form-select-sm" style="width:auto;" id="cantidadReporteTickets">
                                <option value="10">10</option>
                                <option value="25">25</option>
                                <option value="50" selected>50</option>
                                <option value="100">100</option>
                                <option value="todos">Todos</option>
                            </select>
                        </div>
                        <div id="verMasReporteTickets" class="d-none mt-2 text-center"></div>

                        <div class="d-flex flex-wrap gap-3 small text-muted border-top pt-3 mt-1" id="totalesReporteTickets"></div>
                    </div>
                </div>

            </main>
            <div id="footer-placeholder"></div>
        </div>
    </div>

    <!-- Contenedor de la vista imprimible del reporte — oculto en pantalla,
         poblado por js/imprimir.js justo antes de window.print() -->
    <div id="areaImprimir"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/codigos.js"></script>
    <script src="js/imprimir.js"></script>
    <script src="js/search.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/reportes-comun.js"></script>
    <script src="js/reporte-tickets.js"></script>
</body>

</html>
