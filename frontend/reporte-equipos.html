<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <script>(function () { var t = localStorage.getItem("tema"); if (t) { document.documentElement.setAttribute("data-theme", t); return; } try { var u = JSON.parse(sessionStorage.getItem("usuario") || "null"); if (u && u.rol === "Tecnico") { document.documentElement.setAttribute("data-theme", "dark"); } } catch (e) {} })();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipos Registrados | ITDESK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css?v=2">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body data-protegido="Administrador" data-footer="Reporte de Equipos Registrados">
    <div class="app-shell">
        <div id="sidebar-placeholder"></div>
        <div class="app-main">
            <div id="topbar-mobile-placeholder"></div>
            <div id="topbar-desktop-placeholder"></div>
            <main class="app-content">

                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb breadcrumb-itdesk">
                        <li class="breadcrumb-item"><a href="dashboard-admin.html">Inicio</a></li>
                        <li class="breadcrumb-item"><a href="reportes.html">Reportes</a></li>
                        <li class="breadcrumb-item active">Equipos registrados</li>
                    </ol>
                </nav>

                <div class="page-head">
                    <div class="page-head-text">
                        <h2>Reporte de Equipos Registrados</h2>
                        <p class="text-muted" id="equiposActualizado">Cargando datos en vivo...</p>
                    </div>
                </div>
                <div class="alert alert-danger d-none mt-2 py-2 px-3" id="equiposError"></div>

                <div class="card shadow">
                    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <h4 class="mb-0">Reporte de Equipos Registrados</h4>
                        <button type="button" class="btn btn-primary btn-sm" id="btnImprimirReporteEquipos">
                            <i class="bi bi-printer"></i> Imprimir / Guardar PDF
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="input-group input-group-sm mb-3" style="max-width: 380px;">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <label class="visually-hidden" for="buscarEquiposReporte">Buscar equipos</label>
                            <input type="text" id="buscarEquiposReporte" class="form-control"
                                placeholder="Buscar por código, tipo, marca, cliente...">
                        </div>
                        <span class="visually-hidden" aria-live="polite" id="resultadosBusquedaEquiposReporte"></span>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle table-mobile-cards">
                                <thead>
                                    <tr>
                                        <th>No.</th>
                                        <th>Código</th>
                                        <th>Tipo</th>
                                        <th>Marca</th>
                                        <th>Modelo</th>
                                        <th>Serial</th>
                                        <th>Cliente</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaReporteEquipos">
                                    <tr><td colspan="8" class="text-center text-muted">Cargando equipos...</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-end mt-2">
                            <label class="visually-hidden" for="cantidadReporteEquipos">Cantidad a mostrar</label>
                            <select class="form-select form-select-sm" style="width:auto;" id="cantidadReporteEquipos">
                                <option value="10">10</option>
                                <option value="25">25</option>
                                <option value="50" selected>50</option>
                                <option value="100">100</option>
                                <option value="todos">Todos</option>
                            </select>
                        </div>
                        <div id="verMasReporteEquipos" class="d-none mt-2 text-center"></div>

                        <div class="card card-info mt-3 d-none" id="detalleEquipoSeleccionado">
                            <div class="card-body" id="detalleEquipoSeleccionadoBody"></div>
                        </div>

                        <div class="d-flex flex-wrap gap-3 small text-muted border-top pt-3 mt-3" id="totalesReporteEquipos"></div>
                    </div>
                </div>

            </main>
            <div id="footer-placeholder"></div>
        </div>
    </div>

    <!-- Contenedor de la vista imprimible del reporte — oculto en pantalla,
         poblado por js/imprimir.js justo antes de window.print() -->
    <div id="areaImprimir"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/codigos.js"></script>
    <script src="js/imprimir.js"></script>
    <script src="js/search.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/reportes-comun.js"></script>
    <script src="js/reporte-equipos.js"></script>
</body>

</html>
