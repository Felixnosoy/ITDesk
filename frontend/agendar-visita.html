<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <script>(function () { var t = localStorage.getItem("tema"); if (t) { document.documentElement.setAttribute("data-theme", t); return; } try { var u = JSON.parse(sessionStorage.getItem("usuario") || "null"); if (u && u.rol === "Tecnico") { document.documentElement.setAttribute("data-theme", "dark"); } } catch (e) {} })();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar visita técnica | ITDESK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css?v=2">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body data-protegido="Cliente" data-titulo="Agendar visita técnica" data-footer="Agendar visita técnica">
    <div class="app-shell">
        <div id="sidebar-placeholder"></div>
        <div class="app-main">
            <div id="topbar-mobile-placeholder"></div>
            <div id="topbar-desktop-placeholder"></div>
            <main class="app-content">

                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb breadcrumb-itdesk">
                        <li class="breadcrumb-item"><a href="dashboard-cliente.html">Inicio</a></li>
                        <li class="breadcrumb-item"><a href="mis-visitas.html">Visitas técnicas</a></li>
                        <li class="breadcrumb-item active">Agendar</li>
                    </ol>
                </nav>

                <div class="page-head">
                    <div class="page-head-text">
                        <h2>Solicitar visita técnica</h2>
                        <p class="text-muted">Un miembro del equipo confirmará la fecha, hora y técnico asignado.</p>
                    </div>
                </div>

                <div class="card-info" style="max-width: 640px;">
                    <form id="formAgendarVisita" onsubmit="solicitarVisita(event)">
                        <div class="mb-3">
                            <label class="form-label" for="visitaEspecialidad">Tipo de servicio <span class="campo-requerido">*</span></label>
                            <select class="form-select" id="visitaEspecialidad" required>
                                <option value="" selected disabled>Seleccioná una opción...</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-sm-6 mb-3">
                                <label class="form-label" for="visitaFecha">Fecha <span class="campo-requerido">*</span></label>
                                <input type="date" class="form-control" id="visitaFecha" required>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="form-label" for="visitaHora">Hora <span class="campo-requerido">*</span></label>
                                <input type="time" class="form-control" id="visitaHora" required>
                            </div>
                        </div>

                        <div id="visitaDisponibilidad" class="mb-3 small text-muted d-none"></div>

                        <div class="mb-3">
                            <label class="form-label" for="visitaDireccion">Dirección donde te atenderán <span class="campo-requerido">*</span></label>
                            <input type="text" class="form-control" id="visitaDireccion" required maxlength="255" placeholder="Calle, número, sector...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="visitaMotivo">Motivo de la visita <span class="campo-requerido">*</span></label>
                            <textarea class="form-control" id="visitaMotivo" rows="4" required placeholder="Contanos qué necesitás resolver..."></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="mis-visitas.html" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Solicitar visita</button>
                        </div>
                    </form>
                </div>

            </main>
            <div id="footer-placeholder"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/agendar-visita.js"></script>
</body>

</html>
