<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <script>(function () { var t = localStorage.getItem("tema"); if (t) { document.documentElement.setAttribute("data-theme", t); } })();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Cliente | ITDESK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-protegido="Cliente">
    <div class="app-shell">
        <div id="sidebar-placeholder"></div>
        <div class="app-main">
            <div id="topbar-mobile-placeholder"></div>
            <main class="app-content">

                <div class="page-head">
                    <h2>Hola, <strong id="saludoUsuario"></strong></h2>
                    <p>Así va tu equipo con nosotros.</p>
                </div>

                <!-- ESTADO DESTACADO -->
                <div class="mb-4" id="seccionDestacada"></div>

                <!-- ESTADISTICAS -->
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="card card-stat shadow-sm">
                            <div class="card-body">
                                <div class="card-stat-head">
                                    <span class="card-stat-icon tone-accent"><i class="bi bi-ticket-perforated"></i></span>
                                    <span class="card-stat-label">Tickets Registrados</span>
                                </div>
                                <div class="card-stat-value" id="totalTickets">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card card-stat shadow-sm">
                            <div class="card-body">
                                <div class="card-stat-head">
                                    <span class="card-stat-icon tone-warning"><i class="bi bi-tools"></i></span>
                                    <span class="card-stat-label">En Proceso</span>
                                </div>
                                <div class="card-stat-value" id="ticketsProceso">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card card-stat shadow-sm">
                            <div class="card-body">
                                <div class="card-stat-head">
                                    <span class="card-stat-icon tone-success"><i class="bi bi-check-circle"></i></span>
                                    <span class="card-stat-label">Tickets Resueltos</span>
                                </div>
                                <div class="card-stat-value" id="ticketsResueltos">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TABLA DE TICKETS -->
                <div class="mb-5">
                    <div class="card shadow">
                        <div class="card-header bg-itdesk text-white">
                            <h4 class="mb-0">Tickets activos</h4>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle table-mobile-cards">
                                    <thead>
                                        <tr>
                                            <th data-sort="id_ticket">ID</th>
                                            <th data-sort="equipo_tipo">Equipo</th>
                                            <th data-sort="titulo">Título</th>
                                            <th data-sort="categoria">Categoría</th>
                                            <th data-sort="estado">Estado</th>
                                            <th>Detalle</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaTickets">
                                        <tr>
                                            <td colspan="6" class="text-center text-muted">Cargando tickets...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
            <div id="footer-placeholder"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/codigos.js"></script>
    <script src="js/ordenar.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/cliente.js"></script>
</body>

</html>
