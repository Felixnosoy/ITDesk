<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <script>(function () { var t = localStorage.getItem("tema"); if (t) { document.documentElement.setAttribute("data-theme", t); return; } try { var u = JSON.parse(sessionStorage.getItem("usuario") || "null"); if (u && u.rol === "Tecnico") { document.documentElement.setAttribute("data-theme", "dark"); } } catch (e) {} })();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Cliente | ITDESK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css?v=2">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body data-protegido="Cliente">
    <div class="app-shell">
        <div id="sidebar-placeholder"></div>
        <div class="app-main">
            <div id="topbar-mobile-placeholder"></div>
            <main class="app-content">

                <div class="page-head">
                    <div class="page-head-text">
                        <h2>Hola, <strong id="saludoUsuario"></strong></h2>
                        <p>Así va tu equipo con nosotros.</p>
                    </div>
                </div>

                <!-- ESTADO DESTACADO -->
                <div class="mb-4" id="seccionDestacada"></div>

                <!-- ESTADISTICAS -->
                <div class="mini-stat-strip mb-4">
                    <div class="mini-stat">
                        <span class="mini-stat-label"><i class="bi bi-ticket-perforated"></i> Tickets registrados</span>
                        <span class="mini-stat-value" id="totalTickets">0</span>
                    </div>
                    <div class="mini-stat">
                        <span class="mini-stat-label"><i class="bi bi-tools"></i> En proceso</span>
                        <span class="mini-stat-value" id="ticketsProceso">0</span>
                    </div>
                    <div class="mini-stat">
                        <span class="mini-stat-label"><i class="bi bi-check-circle"></i> Resueltos</span>
                        <span class="mini-stat-value" id="ticketsResueltos">0</span>
                    </div>
                </div>

                <!-- TICKETS ACTIVOS -->
                <div class="mb-5">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                        <h4 class="mb-0">Tus tickets</h4>
                        <div style="max-width: 200px;">
                            <label class="visually-hidden" for="ordenListaCliente">Ordenar por</label>
                            <select class="form-select form-select-sm" id="ordenListaCliente">
                                <option value=":asc">Más reciente</option>
                                <option value="estado:asc">Estado</option>
                                <option value="titulo:asc">Título</option>
                            </select>
                        </div>
                    </div>
                    <div class="row g-3" id="listaTickets">
                        <div class="col-12 text-center text-muted py-4">Cargando tickets...</div>
                    </div>
                </div>

            </main>
            <div id="footer-placeholder"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/codigos.js"></script>
    <script src="js/ordenar.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/cliente.js"></script>
</body>

</html>
