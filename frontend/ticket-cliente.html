<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <script>(function () { var t = localStorage.getItem("tema"); if (t) { document.documentElement.setAttribute("data-theme", t); return; } try { var u = JSON.parse(sessionStorage.getItem("usuario") || "null"); if (u && u.rol === "Tecnico") { document.documentElement.setAttribute("data-theme", "dark"); } } catch (e) {} })();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Ticket | ITDESK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css?v=2">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body data-protegido="Cliente">
    <div class="app-shell">
        <div id="sidebar-placeholder"></div>
        <div class="app-main">
            <div id="topbar-mobile-placeholder"></div>
            <main class="app-content">

                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb breadcrumb-itdesk">
                        <li class="breadcrumb-item"><a href="dashboard-cliente.html">Mis tickets</a></li>
                        <li class="breadcrumb-item active" id="breadcrumbTicket">Ticket</li>
                    </ol>
                </nav>

                <!-- SKELETON -->
                <div id="skeletonTicket">
                    <span class="skeleton-line mb-3" style="height:32px;width:280px;"></span>
                    <span class="skeleton-line mb-2" style="height:100px;"></span>
                </div>

                <div id="contenidoTicket" class="d-none">

                    <div class="card shadow mb-4">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                                <div>
                                    <h3 class="mb-1" id="tituloTicket"></h3>
                                    <div class="d-flex align-items-center gap-2 flex-wrap">
                                        <span id="badgeEstadoTicket"></span>
                                        <span id="badgeCategoriaTicket"></span>
                                    </div>
                                </div>
                                <div class="text-md-end">
                                    <small class="text-muted d-block">Apertura: <span id="fechaAperturaTicket"></span></small>
                                    <small class="text-muted d-block d-none" id="fechaCierreWrap">Cierre: <span id="fechaCierreTicket"></span></small>
                                </div>
                            </div>
                            <hr>
                            <p class="mb-0" id="descripcionTicket"></p>
                        </div>
                    </div>

                    <div class="row g-4">
                        <div class="col-lg-4">
                            <div class="card card-info shadow card-accent card-accent-secondary">
                                <div class="card-header"><i class="bi bi-pc-display"></i> Equipo</div>
                                <div class="card-body" id="infoEquipo"></div>
                            </div>
                        </div>

                        <div class="col-lg-8">
                            <div class="card shadow">
                                <div class="card-header">
                                    <i class="bi bi-clock-history"></i> Avance de tu ticket
                                </div>
                                <div class="card-body">
                                    <div id="timelinePublico"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Cotizacion: solo aparece si el ticket tiene alguna
                         (ver cargarCotizacion() en ticket-cliente.js) -->
                    <div class="row g-4 mt-1 d-none" id="filaCotizacion">
                        <div class="col-12">
                            <div class="card shadow card-accent card-accent-info">
                                <div class="card-header"><i class="bi bi-file-earmark-text"></i> Cotización</div>
                                <div class="card-body" id="cuerpoCotizacion"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Encuesta de satisfaccion: solo aparece si el ticket
                         ya esta Cerrado — ver mostrarSeccionEncuesta() -->
                    <div class="row g-4 mt-1 d-none" id="filaEncuesta">
                        <div class="col-12">
                            <div class="card shadow card-accent card-accent-warning">
                                <div class="card-body" id="cuerpoEncuesta"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
            <div id="footer-placeholder"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/codigos.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/ticket-cliente.js"></script>
</body>

</html>
